name: Build and push images to GHCR

on:
    push:
        branches: ["main"]
    workflow_dispatch: # allow manual trigger

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        strategy:
            matrix:
                environment: [production, development]

        environment: ${{ matrix.environment }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set outputs
              id: vars
              run: |
                  echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                  if [ "${{ matrix.environment }}" = "production" ]; then
                    echo "tag_prefix=latest" >> $GITHUB_OUTPUT
                    echo "tag_suffix=" >> $GITHUB_OUTPUT
                  else
                    echo "tag_prefix=dev" >> $GITHUB_OUTPUT
                    echo "tag_suffix=dev-" >> $GITHUB_OUTPUT
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/class-compass-frontend:cache-${{ matrix.environment }}
                  cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/class-compass-frontend:cache-${{ matrix.environment }},mode=max
                  build-args: |
                      VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
                      VITE_KRATOS_URL=${{ vars.VITE_KRATOS_URL }}
                      VITE_API_URL=${{ vars.VITE_API_URL }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/class-compass-frontend:${{ steps.vars.outputs.tag_prefix }}
                      ghcr.io/${{ github.repository_owner }}/class-compass-frontend:${{ steps.vars.outputs.tag_suffix }}${{ steps.vars.outputs.sha_short }}
